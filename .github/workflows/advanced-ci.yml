name: Advanced CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Project
        run: echo "Build Successful!"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run Tests
        run: echo "All Tests Passed!"
