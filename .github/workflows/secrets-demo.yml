name: GitHub Secrets Demo

on:
  push:
    branches:
      - feature-secrets

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check Secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "GitHub Secret is configured!"
          else
            echo "GitHub Secret is missing!"
            exit 1
          fi
